- name: Validate variables for install.yml task
  ansible.builtin.assert:
    that:
      - lsyncd_version is defined

- name: Install Lsyncd
  ansible.builtin.apt:
    name: "lsyncd={{ lsyncd_version }}"
    state: present
    update_cache: true
    allow_downgrade: true

- name: Enable Lsyncd daemon
  ansible.builtin.service:
    name: lsyncd
    enabled: true

- name: Create Lsyncd config and log directories
  ansible.builtin.file:
    name: "{{ lsyncd_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop:
    - "{{ lsyncd_config_base }}"
    - "{{ lsyncd_log_base }}"
  loop_control:
    loop_var: lsyncd_dir

- name: Create Lsyncd log and status files
  ansible.builtin.file:
    name: "{{ lsyncd_file }}"
    state: touch
    owner: root
    group: root
    mode: '0644'
    modification_time: preserve
    access_time: preserve
  loop:
    - "{{ lsyncd_log_file }}"
    - "{{ lsyncd_status_file }}"
  loop_control:
    loop_var: lsyncd_file
