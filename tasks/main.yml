- name: Create lsyncd_action_list
  ansible.builtin.set_fact:
    lsyncd_action_list: "{{ (lsyncd_actions | default('')).split(',') | reject('equalto', '') | list }}"

- name: Validate lsyncd_action_list
  ansible.builtin.assert:
    that:
      - lsyncd_action_list | length > 0
      - lsyncd_action_list | difference(lsyncd_supported_actions) | length == 0
    fail_msg: "lsyncd_actions must be set to one or more of: {{ lsyncd_supported_actions | join(', ') }}"

- name: Deploy Lsyncd
  ansible.builtin.include_tasks: "{{ task_name }}.yml"
  loop: "{{ lsyncd_action_list }}"
  loop_control:
    loop_var: task_name
